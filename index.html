<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bubble Wrap Sweeper</title>
    <link rel="stylesheet" href="style.css">

    <!-- PWA: installable app metadata + icons -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#dab077">
    <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Bubble Sweeper">
</head>
<body>
    <!-- iOS/WebKit can't truly lock orientation for web content (see the
         comment near .rotate-overlay in style.css), so this overlay is shown
         via a CSS orientation media query whenever the viewport is landscape
         on a touchscreen device, blocking play until the user rotates back to
         portrait. Laptops/desktops are unaffected even in a landscape layout. -->
    <div class="rotate-overlay" id="rotate-overlay">
        <div class="rotate-overlay-icon">&#128241;</div>
        <p>Please rotate your device back to portrait to keep playing.</p>
    </div>

    <!-- Preloaded so the pop sound plays instantly with no load-time delay -->
    <audio id="pop-sound" src="pop.mp3" preload="auto"></audio>
    <audio id="multi-pop-sound" src="multipop.mp3" preload="auto"></audio>
    <audio id="warning-sound" src="warning.mp3" preload="auto"></audio>
    <audio id="warning-sound-reverse" src="warning-reversed2.mp3" preload="auto"></audio>
    <audio id="warning-sound-deny" src="warning-denied.mp3" preload="auto"></audio>
    <audio id="lose-sound" src="lose.mp3" preload="auto"></audio>
    <audio id="win-sound" src="winner.mp3" preload="auto"></audio>
    <audio id="new-sound" src="new.mp3" preload="auto"></audio>
    <!-- Background music (bgm-full.wav: intro immediately followed by the
         loop section, pre-trimmed and concatenated for a gapless loop) is
         loaded and scheduled via the Web Audio API in script.js instead of
         an <audio> element - see script.js for details. -->

    <!-- Shown first so the game's first user interaction (the Start button)
         can satisfy the browser's autoplay-gesture requirement for bg-music. -->
    <div id="welcome-screen" class="welcome-screen">
        <div class="label-header">
            <div class="service-level">B</div>
            <div class="stamp">
                Priority Mail<br />
                No US Postage<br />
                This is just a<br />
                Game
            </div>
        </div>
        <div class="title-holder">
            <h1>Bubble Wrap Sweeper</h1>
        </div>
        <div class="label-body">
            <p>Pop every safe bubble, flag every bomb, and don't get caught in the pop!</p>
            <button id="start-game-button">Start Game</button>
        </div>
        <div class="label-footer">
            <!-- DON'T FORGET TO UPDATE THE VERSION NUMBER -->
            <!-- IN THE SERVICE WORKER -->
            <label>Version# - 1.7</label>
            <div class="fake-barcode">
                <svg viewBox="0 0 200 50" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" width="100%" height="50">
                    <rect x="0" y="0" width="200" height="50" fill="white"/>
                    <g fill="black">
                        <rect x="2" y="5" width="2" height="40"/>
                        <rect x="6" y="5" width="1" height="40"/>
                        <rect x="9" y="5" width="3" height="40"/>
                        <rect x="14" y="5" width="1" height="40"/>
                        <rect x="17" y="5" width="2" height="40"/>
                        <rect x="21" y="5" width="1" height="40"/>
                        <rect x="24" y="5" width="4" height="40"/>
                        <rect x="30" y="5" width="1" height="40"/>
                        <rect x="33" y="5" width="2" height="40"/>
                        <rect x="37" y="5" width="1" height="40"/>
                        <rect x="40" y="5" width="3" height="40"/>
                        <rect x="45" y="5" width="1" height="40"/>
                        <rect x="48" y="5" width="2" height="40"/>
                        <rect x="52" y="5" width="1" height="40"/>
                        <rect x="55" y="5" width="4" height="40"/>
                        <rect x="61" y="5" width="1" height="40"/>
                        <rect x="64" y="5" width="2" height="40"/>
                        <rect x="68" y="5" width="1" height="40"/>
                        <rect x="71" y="5" width="3" height="40"/>
                        <rect x="76" y="5" width="1" height="40"/>
                        <rect x="79" y="5" width="1" height="40"/>
                        <rect x="82" y="5" width="2" height="40"/>
                        <rect x="86" y="5" width="4" height="40"/>
                        <rect x="92" y="5" width="1" height="40"/>
                        <rect x="95" y="5" width="2" height="40"/>
                        <rect x="99" y="5" width="1" height="40"/>
                        <rect x="102" y="5" width="3" height="40"/>
                        <rect x="107" y="5" width="1" height="40"/>
                        <rect x="110" y="5" width="2" height="40"/>
                        <rect x="114" y="5" width="1" height="40"/>
                        <rect x="117" y="5" width="4" height="40"/>
                        <rect x="123" y="5" width="1" height="40"/>

                        <rect x="169" y="5" width="1" height="40"/>

                        <rect x="192" y="5" width="1" height="40"/>
                        <rect x="195" y="5" width="3" height="40"/>
                    </g>
                </svg>
            </div>
            <label>0123 4567 8910 9876 5432 10</label>
        </div>
    </div>

    <!-- Bubbles are generated dynamically in script.js based on fieldSize -->
    <div id="game-container" class="game-container hidden">
        <div class="controls">
            <div>
                <div class="field-size-stepper">
                    <button type="button" id="field-size-decrement" class="stepper-btn" aria-label="Decrease field size">&minus;</button>
                    <input type="number" id="field-size-input" class="field-size-input" value="6" min="3" max="20" step="1" aria-label="Field size">
                    <button type="button" id="field-size-increment" class="stepper-btn" aria-label="Increase field size">+</button>
                </div>
            </div>
            <div>
                <button class="btn" id="new-game-button">Reset Game</button>
            </div>
            <div class="audio-controls">
                <input type="checkbox" id="mute-music" aria-label="Mute music" />
                <input type="checkbox" id="mute-audio" aria-label="Mute audio" />
            </div>
        </div>
        <div class="data-holder">
            <div class="col">
                <div class="digital-display" id="flag-counter">000</div><i class="flag-icon"></i>
            </div>
            <div class="col">
                <i class="timer-icon"></i><div class="digital-display" id="elapsed-time">000</div>
            </div>
        </div>
        <div class="field-holder">
            <div id="game-message" class="game-message"></div>
            <!--<button id="next-level">Play Next Level</button>-->
            <div class="bubblewrap-container">

                <div class="tape tape1"></div>
                <div class="tape tape2"></div>
                <div class="tape tape3"></div>
                <div class="tape tape4"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('service-worker.js');
        });
      }
    </script>
</body>
</html>
