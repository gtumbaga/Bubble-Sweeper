<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bubble Sweeper</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Preloaded so the pop sound plays instantly with no load-time delay -->
    <audio id="pop-sound" src="pop.mp3" preload="auto"></audio>
    <audio id="multi-pop-sound" src="multipop.mp3" preload="auto"></audio>
    <audio id="warning-sound" src="warning.mp3" preload="auto"></audio>
    <audio id="warning-sound-reverse" src="warning-reversed.mp3" preload="auto"></audio>
    <audio id="warning-sound-deny" src="warning-denied.mp3" preload="auto"></audio>
    <audio id="lose-sound" src="lose.mp3" preload="auto"></audio>
    <audio id="win-sound" src="winner.mp3" preload="auto"></audio>
    <audio id="new-sound" src="new.mp3" preload="auto"></audio>

    <!-- Bubbles are generated dynamically in script.js based on fieldSize -->
    <div class="controls">
        <button id="new-game-button">New Game</button>
        <div class="field-size-stepper">
            <button type="button" id="field-size-decrement" class="stepper-btn" aria-label="Decrease field size">&minus;</button>
            <input type="number" id="field-size-input" class="field-size-input" value="6" min="3" max="20" step="1" aria-label="Field size">
            <button type="button" id="field-size-increment" class="stepper-btn" aria-label="Increase field size">+</button>
        </div>
    </div>
    <div id="game-message" class="game-message"></div>
    <div class="data-holder">
        <div id="flag-counter">0</div>
        <div id="elapsed-time"></div>
    </div>
    <div class="field-holder">
        <div class="bubblewrap-container"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
