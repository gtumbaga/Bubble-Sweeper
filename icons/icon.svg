<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bubble-hi" cx="35%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#bfe4ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#4f9fe0" stop-opacity="0.9"/>
    </radialGradient>
  </defs>

  <!-- Background: cardboard-ish shipping-label color to match the game's theme -->
  <rect width="512" height="512" rx="96" fill="#c99a5b"/>
  <rect x="18" y="18" width="476" height="476" rx="82" fill="#dab077"/>

  <!-- 2x2 grid of glossy bubbles -->
  <g>
    <circle cx="176" cy="176" r="108" fill="url(#bubble-hi)" stroke="#2f6fa8" stroke-width="6"/>
    <circle cx="336" cy="176" r="108" fill="url(#bubble-hi)" stroke="#2f6fa8" stroke-width="6"/>
    <circle cx="176" cy="336" r="108" fill="url(#bubble-hi)" stroke="#2f6fa8" stroke-width="6"/>

    <!-- One popped bubble for character -->
    <circle cx="336" cy="336" r="108" fill="#8c8c8c" fill-opacity="0.25" stroke="#2f6fa8" stroke-width="6"/>
    <path d="M 296 296 L 376 376 M 376 296 L 296 376" stroke="#2f6fa8" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
