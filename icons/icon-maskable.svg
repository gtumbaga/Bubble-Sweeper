    <circle cx="336" cy="336" r="108" fill="#8c8c8c" fill-opacity="0.25" stroke="#2f6fa8" stroke-width="6"/>
    <path d="M 296 296 L 376 376 M 376 296 L 296 376" stroke="#2f6fa8" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
