<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bubble-hi" cx="35%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#bfe4ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#4f9fe0" stop-opacity="0.9"/>
    </radialGradient>
